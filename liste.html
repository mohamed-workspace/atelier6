<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#111}
    header{max-width:1000px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
    header a{color:#2563eb;text-decoration:none}
    h1{margin:0;font-size:1.4rem}
    #grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .item img{width:100%;height:200px;object-fit:cover;background:#e5e7eb;display:block}
    .info{padding:12px}
    .info strong{display:block}
    .info span{color:#6b7280;font-size:.9rem}
    #status{max-width:1000px;margin:0 auto;text-align:center;color:#6b7280}
  </style>
</head>
<body>
  <header>
    <h1>Liste des stagiaires</h1>
    <a href="index.html">+ Nouvelle inscription</a>
  </header>
  <p id="status">Chargement...</p>
  <div id="grid"></div>

  <script>
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#e5e7eb"/><text x="100" y="108" font-size="14" text-anchor="middle" fill="#9ca3af">Pas de photo</text></svg>'
    );

    async function charger() {
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/liste.php');
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        if (json.data.length === 0) { status.textContent = 'Aucun stagiaire inscrit.'; return; }
        status.style.display = 'none';

        json.data.forEach((s) => {
          const item = document.createElement('div');
          item.className = 'item';

          const img = document.createElement('img');
          img.alt = s.prenom + ' ' + s.nom;
          img.src = s.photo.startsWith('http') ? s.photo : PLACEHOLDER;
          img.onerror = () => { img.src = PLACEHOLDER; };

          const info = document.createElement('div');
          info.className = 'info';
          const nom = document.createElement('strong');
          nom.textContent = s.prenom + ' ' + s.nom;
          const ville = document.createElement('span');
          ville.textContent = s.ville;
          info.append(nom, ville);

          item.append(img, info);
          grid.appendChild(item);
        });
      } catch (err) {
        status.textContent = 'Erreur de chargement : ' + err.message;
      }
    }
    charger();
  </script>
</body>
</html>
