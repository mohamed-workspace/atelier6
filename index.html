<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription des stagiaires</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#111}
    nav{max-width:420px;margin:0 auto 12px;text-align:right}
    nav a{color:#2563eb;text-decoration:none}
    .card{max-width:420px;margin:0 auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    h1{margin-top:0;font-size:1.4rem}
    label{display:block;margin:14px 0 4px;font-weight:600}
    input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
    button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #msg{margin-top:14px;padding:10px;border-radius:8px;display:none}
    .ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
  </style>
</head>
<body>
  <nav><a href="liste.html">Voir la liste →</a></nav>
  <div class="card">
    <h1>Inscription d'un stagiaire</h1>
    <form id="form">
      <label for="nom">Nom</label>
      <input id="nom" name="nom" required maxlength="100">
      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" required maxlength="100">
      <label for="ville">Ville</label>
      <input id="ville" name="ville" required maxlength="100">
      <label for="photo">Photo</label>
      <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
      <button type="submit" id="btn">Inscrire</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    function afficher(texte, ok) {
      msg.textContent = texte;
      msg.className = ok ? 'ok' : 'err';
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Envoi en cours...';
      msg.style.display = 'none';
      try {
        const res = await fetch('/api/inscrire.php', { method: 'POST', body: new FormData(form) });
        const data = await res.json();
        afficher(data.message, data.success);
        if (data.success) form.reset();
      } catch (err) {
        afficher("Impossible de contacter le serveur.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Inscrire';
      }
    });
  </script>
</body>
</html>
